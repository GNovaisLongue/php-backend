volumes:
  mysql_data:
networks:
  server-db: {}

services:
  mysql:
    container_name: MySQL
    image: mysql:8.1
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/:/docker-entrypoint-initdb.d
    networks:
      - server-db
    ports:
      - 9906:3306

  backend:
    container_name: php-apache
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    env_file:
      - .env
    volumes:
      - ./backend/App/:/var/www/html/App
      - ./backend/index.php:/var/www/html/index.php
      - ./backend/.htaccess:/var/www/html/.htaccess
    networks:
      - server-db
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:80"

  phpmyadmin:
    container_name: mysql-interface
    image: phpmyadmin:5
    restart: always
    environment:
      PMA_HOST: mysql
    networks:
      - server-db
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 8080:80
